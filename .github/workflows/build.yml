
name: Crear APK y AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar juego
        run: test -f www/index.html

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          echo '{"appId":"com.example.escapadelapala3d","appName":"Escapa de la Pala 3D","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Compilar APK y AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug

      - name: Guardar APK y AAB
        uses: actions/upload-artifact@v4
        with:
          name: Escapa-de-la-Pala-3D
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
            
